<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <title>TrussPath — Field Project Management</title>
    <meta name="description" content="TrussPath is a field project management platform for general contractors — projects, tasks, RFIs, daily logs, and punch lists in one place." />
    <meta name="keywords" content="construction project management, field management, general contractor software, RFI, submittals, daily logs, punch lists, construction PM" />
    <meta name="author" content="TrussPath" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TrussPath — Field Project Management" />
    <meta property="og:description" content="The all-in-one field project management platform for general contractors. Projects, tasks, RFIs, daily logs, and punch lists in one place." />
    <meta property="og:site_name" content="TrussPath" />
    <meta property="og:url" content="https://trusspath.com" />
    <meta property="og:image" content="https://trusspath.com/og-image.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TrussPath — Field Project Management" />
    <meta name="twitter:description" content="The all-in-one field project management platform for general contractors. Projects, tasks, RFIs, daily logs, and punch lists in one place." />
    <meta name="twitter:image" content="https://trusspath.com/og-image.png" />

    <!-- Theme color -->
    <meta name="theme-color" content="#f59e0b" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TrussPath" />

    <!-- Fonts are self-hosted from /fonts (see client/src/index.css). Only the
         faces that render above the fold are preloaded — the rest are fetched
         on demand by the @font-face rules. Preloading all nine would compete
         with the JS bundle for bandwidth and defeat the point. -->
    <link rel="preload" href="/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/satoshi-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cabinet-grotesk-800.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
